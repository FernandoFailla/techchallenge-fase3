services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-store:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from urllib.request import urlopen; urlopen(\"http://localhost:5000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mlflow-store:
