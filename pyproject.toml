[project]
name = "techchallenge"
version = "0.1.0"
description = "Educational NLP triage prototype for FIAP Tech Challenge Phase 3."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "dvc-gdrive>=3.0.1",
    "kagglehub>=1.0.2",
    "marimo>=0.23.16",
    "mypy>=1.17.1",
    "polars>=1.43.2",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
