[project]
name = "techchallenge"
version = "0.1.0"
description = "Educational NLP triage prototype for FIAP Tech Challenge Phase 3."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "polars>=1.43.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "apache-airflow>=3.3.1",
    "dvc-gdrive>=3.0.1",
    "kagglehub>=1.0.2",
    "marimo>=0.23.16",
    "mlflow>=3.15.1",
    "mypy>=1.17.1",
    "pre-commit>=4.6.2",
    "pyopenssl>=24.2.1",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E501"]

[tool.ruff.format]
exclude = ["notebooks/*.py"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "sklearn.feature_extraction.text",
    "sklearn.model_selection",
    "sklearn.neighbors",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
